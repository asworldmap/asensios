name: Incident investigation (read-only)

# Read-only forensics for the deploy-key incident. Modifies nothing on the
# VPS. Used to establish the provenance of the unexpected RSA key and to
# prove, from sshd's own logs, which fingerprint CI actually authenticates
# with. Delete alongside the rest of deploy/security once closed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/security/investigate.sh"
      - ".github/workflows/incident-investigate.yml"

concurrency:
  group: incident-investigate
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key and report which key CI is using
        run: |
          set -euo pipefail
          KEY=$(echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$KEY"
          echo "$KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "CI secret decodes to: $(ssh-keygen -y -f /tmp/deploy_key | ssh-keygen -lf - | awk '{print $2, $4}')"

      - name: Run read-only investigation on VPS
        run: |
          set -euo pipefail
          COMMON="-i /tmp/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
          # scp takes -P for the port; ssh takes -p. Reusing one option
          # string for both makes scp treat the port as a source filename.
          SCP_OPTS="$COMMON -P ${{ secrets.REMOTE_PORT || 22 }}"
          SSH_OPTS="$COMMON -p ${{ secrets.REMOTE_PORT || 22 }}"
          scp $SCP_OPTS deploy/security/investigate.sh \
            "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/investigate.sh"
          ssh $SSH_OPTS "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
            "bash /tmp/investigate.sh; rc=\$?; rm -f /tmp/investigate.sh; exit \$rc"
