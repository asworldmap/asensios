name: Deploy blog to Hostinger VPS

# Builds "Relatos desde Santiago" from content/ and deploys the generated
# blog-dist/ to blog.asensios.com. Fully isolated from the apex-site
# workflow (deploy.yml): its own triggers, its own concurrency group, its
# own SSH steps. Never builds or touches the apex site or its deploy
# target. Runs on pushes to main that touch content/ or tools/blog/, and
# can be triggered manually.
#
# SSH_PRIVATE_KEY_B64 was rotated on 2026-08-14 after the previous key was
# exposed in plaintext in earlier Actions logs. The rotated key is an
# ed25519 key with fingerprint
# SHA256:MW/RWTGOYpbmwOSrzb4UQlcS4mhjpoPgSqSkfJDTeSw. The previously
# exposed key was revoked from the VPS on 2026-08-14 at 20:13 UTC.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "tools/blog/**"
      - "deploy/blog/**"
      - ".github/workflows/deploy-blog.yml"
  workflow_dispatch:

concurrency:
  group: deploy-blog-production
  cancel-in-progress: false

jobs:
  deploy-blog:
    runs-on: ubuntu-latest
    # Guards against a hung/throttled SSH connection tying up the runner
    # (and blocking future runs behind the concurrency group) indefinitely —
    # the default with no timeout-minutes is 360.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The printing press: content/ -> blog-dist/. Fails the deploy on a
      # malformed story rather than shipping a broken publication.
      - name: Build Relatos desde Santiago
        run: npm run build:blog

      - name: Check SSH secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.REMOTE_HOST }}" ] || [ -z "${{ secrets.REMOTE_USER }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY_B64 }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::REMOTE_HOST / REMOTE_USER / SSH_PRIVATE_KEY_B64 not fully set — skipping blog deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH key
        if: steps.check.outputs.configured == 'true'
        run: |
          KEY=$(echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$KEY"
          echo "$KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key >/dev/null
          {
            echo 'SSH_PRIVATE_KEY<<EOF'
            echo "$KEY"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Check DNS for blog.asensios.com
        if: steps.check.outputs.configured == 'true'
        run: |
          echo "asensios.com       -> $(getent ahostsv4 asensios.com | awk '{print $1}' | sort -u | paste -sd, -)"
          echo "blog.asensios.com  -> $(getent ahostsv4 blog.asensios.com | awk '{print $1}' | sort -u | paste -sd, -)"

      # Runners intermittently fail the first connection with "Network is
      # unreachable" (seen 3x on 2026-08-14, on otherwise healthy
      # credentials). Absorb that here with backoff so a flaky runner
      # doesn't fail an entire production deploy.
      - name: Wait for VPS SSH to be reachable
        if: steps.check.outputs.configured == 'true'
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            if ssh -i /tmp/deploy_key -p ${{ secrets.REMOTE_PORT || 22 }} \
                 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=15 -o BatchMode=yes \
                 "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" true; then
              echo "SSH reachable on attempt $i"
              exit 0
            fi
            echo "attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::VPS SSH not reachable after 5 attempts"
          exit 1

      # The Caddy block content lives in deploy/blog/Caddyfile.blog.snippet
      # (checked out above) and is copied to the VPS here, rather than
      # embedded inline, to keep this workflow file's YAML/heredoc nesting
      # simple and easy to audit.
      - name: Upload Caddy snippet + apply script to VPS
        if: steps.check.outputs.configured == 'true'
        run: |
          scp -i /tmp/deploy_key -P ${{ secrets.REMOTE_PORT || 22 }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            deploy/blog/Caddyfile.blog.snippet "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/blog-caddy-snippet.conf"
          scp -i /tmp/deploy_key -P ${{ secrets.REMOTE_PORT || 22 }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            deploy/blog/apply-caddy-block.sh "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/tmp/apply-caddy-block.sh"

      # Installs or updates the Caddy site block by running the checked-in
      # script on the VPS. The script owns a marked region of /etc/caddy/Caddyfile
      # and rewrites it on every deploy, so a correction to headers or caching
      # actually reaches production — the previous version appended once and
      # then skipped forever, which silently froze the config. It backs up,
      # validates before reloading, and rolls back if the apex site goes
      # unhealthy. Requires passwordless sudo; fails clearly if absent.
      - name: Configure Caddy for blog.asensios.com (managed block, self-healing)
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/deploy_key -p ${{ secrets.REMOTE_PORT || 22 }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3"
          ssh $SSH_OPTS "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
            'bash /tmp/apply-caddy-block.sh /tmp/blog-caddy-snippet.conf && rm -f /tmp/apply-caddy-block.sh'

      # Deploys via rsync over SSH, same mechanism as the apex job in
      # deploy.yml, but to a fixed, non-secret target — this path is not
      # sensitive, unlike the apex target which stays a secret since it was
      # already configured that way.
      - name: Deploy blog-dist/ to VPS
        if: steps.check.outputs.configured == 'true'
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ env.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          # Generated output of npm run build:blog.
          SOURCE: "blog-dist/"
          # Fixed document root — not secret, deliberately not a repo secret.
          TARGET: "/var/www/blog.asensios.com/"
          ARGS: "-rltgoDzvO --delete"
          EXCLUDE: ".git/, .github/, node_modules/"

      - name: Set static file permissions
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/deploy_key -p ${{ secrets.REMOTE_PORT || 22 }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3"
          ssh $SSH_OPTS "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
            'sudo find /var/www/blog.asensios.com -type d -exec chmod 755 {} \; && sudo find /var/www/blog.asensios.com -type f -exec chmod 644 {} \;'

      # Public verification from this GitHub Actions runner (real, unrestricted
      # outbound network). This checks the ASSETS, not just the HTML: an
      # earlier release shipped a stylesheet that some devices could not load
      # while every page still returned 200, so page-status checks alone
      # proved nothing. Here the stylesheet and script URLs are read back out
      # of the deployed HTML and fetched, confirming status, Content-Type and
      # that the body really is CSS/JS rather than an error page.
      - name: Verify public blog + apex health
        if: steps.check.outputs.configured == 'true'
        run: |
          # No `set -e` / `pipefail` here on purpose. GitHub invokes this step
          # as `bash -e`, and `grep ... | head -1` below takes SIGPIPE when
          # head closes the pipe early; with pipefail that reads as a fatal
          # error and the whole verification aborts before checking anything.
          # This step keeps its own tally in $fail and exits on that.
          set +e
          set -u
          fail=0
          expect() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$1" || echo "000")
            echo "$1 -> $code"
            [ "$code" = "$2" ] || { echo "::error::expected $2 from $1, got $code"; fail=1; }
          }
          expect_healthy() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$1" || echo "000")
            echo "$1 -> $code (following redirects)"
            case "$code" in 2??) ;; *) echo "::error::expected a healthy 2xx from $1, got $code"; fail=1;; esac
          }
          # $1 url, $2 expected Content-Type substring, $3 a string the body must contain
          expect_asset() {
            body=$(mktemp)
            read -r code ctype < <(curl -sS -o "$body" -w '%{http_code} %{content_type}' "$1" || echo "000 none")
            echo "$1 -> $code [$ctype]"
            [ "$code" = "200" ] || { echo "::error::$1 returned $code"; fail=1; }
            case "$ctype" in *"$2"*) ;; *) echo "::error::$1 served as '$ctype', expected $2 -- browsers with nosniff will refuse it"; fail=1;; esac
            grep -qF "$3" "$body" || { echo "::error::$1 body does not look like $2 (missing '$3') -- probably an error page"; fail=1; }
            rm -f "$body"
          }
          expect "https://blog.asensios.com/" 200
          expect "https://blog.asensios.com/relatos/001-no-parti-el-dia-previsto.html" 200
          expect "https://blog.asensios.com/relatos/002-una-bicicleta-ordeno-santiago.html" 200
          expect "https://blog.asensios.com/relatos/003-dificil-arte-estarse-quieto.html" 200
          expect "https://blog.asensios.com/relatos/004-la-diplomacia-tambien-se-come.html" 200
          expect "https://blog.asensios.com/robots.txt" 200
          expect "https://blog.asensios.com/sitemap.xml" 200
          expect "https://blog.asensios.com/this-definitely-does-not-exist" 404

          # Read the fingerprinted asset URLs straight out of the live page, so
          # this checks what a real browser would actually request.
          home=$(curl -sS https://blog.asensios.com/)
          css=$(printf '%s' "$home" | grep -o '/assets/style\.[a-f0-9]*\.css' | head -1)
          js=$(printf '%s' "$home" | grep -o '/assets/site\.[a-f0-9]*\.js' | head -1)
          if [ -z "$css" ] || [ -z "$js" ]; then
            echo "::error::could not find fingerprinted asset URLs in the deployed homepage"
            fail=1
          else
            expect_asset "https://blog.asensios.com$css" "text/css" "Relatos desde Santiago"
            expect_asset "https://blog.asensios.com$js" "javascript" "GA_MEASUREMENT_ID"
          fi

          # Every photograph referenced by story 004 must actually load.
          for img in $(curl -sS https://blog.asensios.com/relatos/004-la-diplomacia-tambien-se-come.html \
                       | grep -o '/media/004/[^"]*' | sort -u); do
            expect_asset "https://blog.asensios.com$img" "image/" ""
          done

          expect_healthy "https://asensios.com/"
          expect_healthy "https://www.asensios.com/"
          exit $fail
