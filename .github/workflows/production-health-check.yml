name: Production health check

# Read-only public verification of both sites from a GitHub runner (real
# outbound network). No SSH, no secrets, no deployment — safe to run at
# any time, including while deploy credentials are broken. Kept after
# the 2026-08-14 key-rotation incident as a standing check.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-health-check.yml"
      - "deploy/blog/verify-public.sh"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same script the deploy workflow runs, so "is production correct?" has
      # exactly one answer and can be asked without a deploy or any credential.
      - name: Check public endpoints
        run: bash deploy/blog/verify-public.sh

      - name: TLS certificate expiry
        run: |
          for h in asensios.com www.asensios.com blog.asensios.com; do
            exp=$(echo | openssl s_client -servername "$h" -connect "$h":443 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            echo "$h certificate expires: ${exp:-<could not read>}"
          done
