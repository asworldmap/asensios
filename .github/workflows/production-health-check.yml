name: Production health check

# Read-only public verification of both sites from a GitHub runner (real
# outbound network). No SSH, no secrets, no deployment — safe to run at
# any time, including while deploy credentials are broken. Kept after
# the 2026-08-14 key-rotation incident as a standing check.
on:
  workflow_dispatch:
  # Deliberately NOT triggered by changes to deploy/blog/verify-public.sh.
  # That path also triggers deploy-blog.yml, and both workflows start from the
  # same push: this one would query production while the deploy is still
  # rsyncing and report a failure against the previous release. That happened
  # once, flagging the new banner as a 404 six seconds before it was uploaded.
  # Post-deploy verification belongs to the deploy job, which runs the same
  # script after rsync. This workflow answers "is production healthy right
  # now?" on demand and independently of any deploy.
  #
  # Fired manually on 2026-08-17 via this comment touch to diagnose a
  # reported ERR_TIMED_OUT against blog.asensios.com from a desktop browser;
  # workflow_dispatch was unavailable to the calling session.
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-health-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same script the deploy workflow runs, so "is production correct?" has
      # exactly one answer and can be asked without a deploy or any credential.
      - name: Check public endpoints
        run: bash deploy/blog/verify-public.sh

      - name: TLS certificate expiry
        run: |
          for h in asensios.com www.asensios.com blog.asensios.com; do
            exp=$(echo | openssl s_client -servername "$h" -connect "$h":443 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            echo "$h certificate expires: ${exp:-<could not read>}"
          done
