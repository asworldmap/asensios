name: Deploy to Hostinger VPS

# Builds the site and rsyncs the production output (dist/) to the VPS over SSH.
# Runs on every push to main, and can be triggered manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without this a stalled SSH connection runs for the 6h default. A
    # transient "Network is unreachable" from the runner hung this step
    # for over 2 minutes on 2026-08-14.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SSH key
        run: |
          KEY=$(echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$KEY"
          echo "$KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key >/dev/null
          {
            echo 'SSH_PRIVATE_KEY<<EOF'
            echo "$KEY"
            echo 'EOF'
          } >> $GITHUB_ENV

      # Runners intermittently fail the first connection with "Network is
      # unreachable" (seen 3x on 2026-08-14, on otherwise healthy
      # credentials). Absorb that here with backoff so a flaky runner
      # doesn't fail an entire production deploy.
      - name: Wait for VPS SSH to be reachable
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            if ssh -i /tmp/deploy_key -p ${{ secrets.REMOTE_PORT || 22 }} \
                 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=15 -o BatchMode=yes \
                 "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" true; then
              echo "SSH reachable on attempt $i"
              exit 0
            fi
            echo "attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done
          echo "::error::VPS SSH not reachable after 5 attempts"
          exit 1

      # Deploys via rsync over SSH. Requires the repository secrets listed below.
      - name: Deploy dist/ to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ env.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          # Local build output (note the trailing slash: copies contents, not the folder)
          SOURCE: "dist/"
          # Absolute path to the site's document root on the VPS
          TARGET: ${{ secrets.REMOTE_TARGET }}
          # Mirror the build: delete remote files no longer present locally.
          # Excludes are protected so nothing outside the build is touched.
          ARGS: "-rltgoDzvO --delete"
          EXCLUDE: ".git/, .github/, node_modules/"
          # Fail fast on an unreachable host instead of hanging on the
          # connect; mirrors the hardening already in deploy-blog.yml.
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3"
