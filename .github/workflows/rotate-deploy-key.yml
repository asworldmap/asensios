name: Rotate compromised deploy SSH key (incident response)

# One-time remediation workflow for the SSH_PRIVATE_KEY_B64 exposure
# incident. Runs only when this file itself is pushed, so it doesn't
# re-fire on unrelated commits. Delete this file once the incident is
# closed (old key removed, rotation confirmed).
#
# This step uses the CURRENT (old, compromised-but-still-valid) key from
# the SSH_PRIVATE_KEY_B64 secret to reach the VPS — that secret cannot be
# rotated from inside this repo (no available credential/tool has
# Actions-secrets write access), so a human must update it before the old
# key can be safely removed. This run only ADDS the new public key and
# reads (does not modify) auth logs; it does not remove anything.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rotate-deploy-key.yml"

concurrency:
  group: rotate-deploy-key
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH key
        run: |
          KEY=$(echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$KEY"
          echo "$KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "=== Fingerprint the secret currently decodes to (public fingerprint, safe to print) ==="
          ssh-keygen -y -f /tmp/deploy_key | ssh-keygen -lf - || echo "ssh-keygen could not derive a public key from this secret's content"
          echo "Expected new-key fingerprint: SHA256:MW/RWTGOYpbmwOSrzb4UQlcS4mhjpoPgSqSkfJDTeSw (github-actions-asensios-rotated-20260814-185255)"

      # The public key below is not a secret (public keys are safe to
      # log/store) — it's hardcoded directly in this quoted heredoc rather
      # than passed as an ssh command-line argument, since a bare
      # VAR="value with spaces" argument gets mangled by ssh's remote
      # command-line reconstruction (ssh just joins argv with spaces).
      #
      # A prior run's "echo ... >> authorized_keys" landed on a line with
      # no trailing newline, concatenating the new key onto the end of the
      # existing github-actions-asensios line into one unparseable line —
      # the key material was right, sshd just couldn't parse either key
      # out of that merged line, hence "Permission denied" despite the
      # secret decoding to exactly the right fingerprint. This step backs
      # up authorized_keys, then repairs it in place with a regex that
      # inserts a newline before every key-type token that isn't already
      # at the start of a line (operating on the file's actual bytes on
      # the server, not a local transcription of it), dedupes any exact
      # duplicate lines, and verifies every resulting line parses cleanly.
      - name: Repair authorized_keys + inspect auth logs (read-only otherwise)
        run: |
          set -euo pipefail
          SSH_OPTS="-i /tmp/deploy_key -p ${{ secrets.REMOTE_PORT || 22 }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3"
          ssh $SSH_OPTS "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" bash -s <<'REMOTE_SCRIPT'
          set -euo pipefail
          AUTHKEYS="$HOME/.ssh/authorized_keys"
          NEW_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILavZPCjmxLEjPgKgXnI2hSl/djDxP7J0XVnfoYupRhi github-actions-asensios-rotated-20260814-185255"

          echo "=== authorized_keys before repair (raw, public keys only, safe to display) ==="
          cat -A "$AUTHKEYS" | tail -c 400
          echo ""

          STAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP="${AUTHKEYS}.backup-${STAMP}"
          cp "$AUTHKEYS" "$BACKUP"
          echo "Backup: $BACKUP"

          python3 - "$AUTHKEYS" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          fixed = re.sub(
              r'(?<!\n)(?<!\A)(ssh-rsa |ssh-ed25519 |ssh-dss |ecdsa-sha2-nistp256 |ecdsa-sha2-nistp384 |ecdsa-sha2-nistp521 )',
              r'\n\1', content,
          )
          lines = [l for l in fixed.split('\n') if l.strip()]
          seen = set()
          deduped = []
          for l in lines:
              if l not in seen:
                  seen.add(l)
                  deduped.append(l)
          with open(path, 'w') as f:
              f.write('\n'.join(deduped) + '\n')
          PYEOF
          chmod 600 "$AUTHKEYS"

          echo "=== authorized_keys after repair -- one entry per line, each fingerprint must resolve ==="
          FAIL=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line" > /tmp/_k.pub
            if ! ssh-keygen -lf /tmp/_k.pub 2>/dev/null; then
              echo "!! FAILED TO PARSE: ${line:0:40}..."
              FAIL=1
            fi
            rm -f /tmp/_k.pub
          done < "$AUTHKEYS"

          echo ""
          if grep -qF "$NEW_KEY" "$AUTHKEYS"; then
            echo "New rotated key confirmed present as its own clean line."
          else
            echo "!! New rotated key NOT found as a clean line after repair."
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            echo "::error::Repair did not produce a fully clean authorized_keys -- restoring backup."
            cp "$BACKUP" "$AUTHKEYS"
            exit 1
          fi

          echo ""
          echo "=== sudo capability check (informational only, no change) ==="
          if sudo -n true 2>/dev/null; then
            echo "passwordless sudo: available (existing config, unchanged)"
          else
            echo "passwordless sudo: NOT available"
          fi

          echo ""
          echo "=== SSH auth log inspection (read-only) ==="
          if command -v journalctl >/dev/null 2>&1 && sudo -n journalctl -u ssh --since "2026-08-01" >/dev/null 2>&1; then
            echo "--- accepted/failed publickey events since 2026-08-01 (journalctl -u ssh) ---"
            sudo journalctl -u ssh --since "2026-08-01" --no-pager 2>/dev/null | grep -iE "Accepted|Failed|Invalid user|Disconnected" || echo "(no matching lines)"
          elif [ -r /var/log/auth.log ]; then
            echo "--- accepted/failed publickey events (/var/log/auth.log) ---"
            grep -iE "Accepted|Failed|Invalid user|Disconnected" /var/log/auth.log 2>/dev/null | tail -200 || echo "(no matching lines)"
          else
            echo "No readable ssh auth log source found (journalctl -u ssh and /var/log/auth.log both unavailable to this user)."
          fi
          REMOTE_SCRIPT
